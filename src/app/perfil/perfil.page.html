<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" aria-label="Voltar para home"></ion-back-button>
    </ion-buttons>
    <ion-title>Meu Perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button *ngIf="!isEditando" (click)="iniciarEdicao()" aria-label="Editar perfil">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div *ngIf="isLoading" class="loading-area">
    <ion-skeleton-text animated style="width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px;"></ion-skeleton-text>
    <ion-skeleton-text animated style="width: 60%; height: 20px; margin: 8px auto;"></ion-skeleton-text>
    <ion-skeleton-text animated style="width: 80%; height: 16px; margin: 8px auto;"></ion-skeleton-text>
  </div>

  <div *ngIf="!isLoading">

    <!-- Avatar -->
    <div class="avatar-area">
      <div class="avatar-circle" aria-hidden="true">
        <ion-icon name="person-outline"></ion-icon>
      </div>
    </div>

    <!-- Modo Visualização -->
    <div *ngIf="!isEditando">
      <ion-list>
        <ion-item>
          <ion-label>
            <p>Nome</p>
            <h3 [attr.aria-label]="'Nome: ' + (perfil?.nome || 'Não informado')">
              {{ perfil?.nome || 'Não informado' }}
            </h3>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>Email</p>
            <h3 [attr.aria-label]="'Email: ' + (perfil?.email || '')">
              {{ perfil?.email || '' }}
            </h3>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <p>Esporte favorito</p>
            <h3 [attr.aria-label]="'Esporte favorito: ' + (perfil?.esporteFavorito || 'Não informado')">
              {{ perfil?.esporteFavorito || 'Não informado' }}
            </h3>
          </ion-label>
        </ion-item>
      </ion-list>
    </div>

    <!-- Modo Edição -->
    <form *ngIf="isEditando" [formGroup]="form" (ngSubmit)="salvar()">

      <ion-input
        label="Nome"
        label-placement="stacked"
        type="text"
        formControlName="nome"
        aria-label="Nome completo"
        fill="outline"
        class="ion-margin-bottom">
      </ion-input>
      <ion-text color="danger" role="alert" aria-live="polite" *ngIf="nome?.invalid && nome?.touched">
        <p class="error-msg">Nome é obrigatório</p>
      </ion-text>

      <ion-input
        label="Esporte favorito"
        label-placement="stacked"
        type="text"
        formControlName="esporteFavorito"
        placeholder="Ex: Futebol"
        aria-label="Esporte favorito"
        fill="outline"
        class="ion-margin-bottom">
      </ion-input>

      <div class="btn-area">
        <ion-button expand="block" type="submit" aria-label="Salvar alterações do perfil">
          Salvar
        </ion-button>
        <ion-button expand="block" fill="outline" type="button" (click)="cancelarEdicao()" aria-label="Cancelar edição">
          Cancelar
        </ion-button>
      </div>
    </form>

    <!-- Logout -->
    <div class="logout-area" *ngIf="!isEditando">
      <ion-button expand="block" fill="outline" color="danger" (click)="sair()" aria-label="Sair da conta">
        <ion-icon slot="start" name="log-out-outline" aria-hidden="true"></ion-icon>
        Sair da conta
      </ion-button>
    </div>

  </div>

</ion-content>
