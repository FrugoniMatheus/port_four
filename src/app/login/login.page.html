<ion-header>
  <ion-toolbar color="primary">
    <ion-title>SportTrack</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-container">

    <div class="logo-area">
      <ion-icon name="fitness-outline" class="logo-icon" aria-hidden="true"></ion-icon>
      <h1>Bem-vindo!</h1>
      <p>Faça login para acompanhar seus treinos</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="entrar()">

      <ion-input
        label="Email"
        label-placement="stacked"
        type="email"
        formControlName="email"
        placeholder="seu@email.com"
        aria-label="Email"
        autocomplete="email"
        fill="outline"
        class="ion-margin-bottom">
      </ion-input>
      <ion-text color="danger" role="alert" aria-live="polite" *ngIf="email?.invalid && email?.touched">
        <p class="error-msg">Digite um email válido</p>
      </ion-text>

      <ion-input
        label="Senha"
        label-placement="stacked"
        type="password"
        formControlName="senha"
        placeholder="Mínimo 6 caracteres"
        aria-label="Senha"
        autocomplete="current-password"
        fill="outline"
        class="ion-margin-bottom">
      </ion-input>
      <ion-text color="danger" role="alert" aria-live="polite" *ngIf="senha?.invalid && senha?.touched">
        <p class="error-msg">Senha deve ter pelo menos 6 caracteres</p>
      </ion-text>

      <ion-text color="danger" role="alert" aria-live="polite" *ngIf="erroLogin">
        <p class="error-msg">{{ erroLogin }}</p>
      </ion-text>

      <ion-button
        expand="block"
        type="submit"
        class="ion-margin-top"
        [disabled]="isLoading"
        aria-label="Entrar na conta">
        <ion-spinner name="crescent" *ngIf="isLoading" aria-hidden="true"></ion-spinner>
        <span *ngIf="!isLoading">Entrar</span>
      </ion-button>

    </form>

    <div class="links-area">
      <ion-button fill="clear" routerLink="/cadastro" aria-label="Ir para cadastro de nova conta">
        Criar conta
      </ion-button>
      <ion-button fill="clear" routerLink="/recuperar-senha" aria-label="Recuperar senha esquecida">
        Esqueci minha senha
      </ion-button>
    </div>

  </div>
</ion-content>
