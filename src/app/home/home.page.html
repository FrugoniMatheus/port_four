<ion-header>
  <ion-toolbar color="primary">
    <ion-title>SportTrack</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/perfil" aria-label="Ir para o perfil">
        <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div *ngIf="isLoading" class="loading-area">
    <ion-skeleton-text animated style="width: 60%; height: 24px; margin: 8px auto;"></ion-skeleton-text>
    <ion-skeleton-text animated style="width: 100%; height: 80px; margin: 8px 0;"></ion-skeleton-text>
    <ion-skeleton-text animated style="width: 100%; height: 80px; margin: 8px 0;"></ion-skeleton-text>
  </div>

  <div *ngIf="!isLoading">

    <!-- Saudação -->
    <div class="greeting-area">
      <h2>Olá, {{ perfil?.nome || 'Atleta' }}! 👋</h2>
      <p>Pronto para treinar hoje?</p>
    </div>

    <!-- Card: Total de Treinos -->
    <ion-card
      [attr.aria-label]="'Total de treinos registrados: ' + totalTreinos"
      class="stat-card">
      <ion-card-content>
        <div class="stat-row">
          <ion-icon name="barbell-outline" color="primary" aria-hidden="true"></ion-icon>
          <div>
            <p class="stat-label">Treinos registrados</p>
            <h2 class="stat-value">{{ totalTreinos }}</h2>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Card: Meta Ativa -->
    <ion-card class="meta-card">
      <ion-card-header>
        <ion-card-subtitle>Meta ativa</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content *ngIf="metaAtiva; else semMeta">
        <p class="meta-titulo" [attr.aria-label]="'Meta: ' + metaAtiva.titulo">
          {{ metaAtiva.titulo }}
        </p>
        <ion-chip color="primary" aria-hidden="true">
          <ion-label>{{ metaAtiva.tipo }}</ion-label>
        </ion-chip>
        <p class="meta-prazo">
          <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
          Prazo: {{ metaAtiva.prazo }}
        </p>
      </ion-card-content>
      <ng-template #semMeta>
        <ion-card-content>
          <p>Nenhuma meta definida ainda.</p>
          <ion-button fill="outline" size="small" routerLink="/nova-meta" aria-label="Criar nova meta esportiva">
            Criar meta
          </ion-button>
        </ion-card-content>
      </ng-template>
    </ion-card>

    <!-- Ações rápidas -->
    <div class="actions-area">
      <ion-button
        expand="block"
        routerLink="/registrar-treino"
        aria-label="Registrar novo treino">
        <ion-icon slot="start" name="add-circle-outline" aria-hidden="true"></ion-icon>
        Registrar Treino
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        routerLink="/nova-meta"
        aria-label="Criar nova meta esportiva">
        <ion-icon slot="start" name="flag-outline" aria-hidden="true"></ion-icon>
        Nova Meta
      </ion-button>

      <ion-button
        expand="block"
        fill="clear"
        routerLink="/perfil"
        aria-label="Ir para meu perfil de atleta">
        <ion-icon slot="start" name="person-outline" aria-hidden="true"></ion-icon>
        Meu Perfil
      </ion-button>
    </div>

  </div>

</ion-content>
